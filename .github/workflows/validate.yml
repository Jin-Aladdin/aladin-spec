name: Validate

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

# The workflow only reads the repository. It needs no secrets and performs
# no deployment.
permissions:
  contents: read

jobs:
  validate:
    name: Schemas and examples (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate schemas and example packs
        run: python scripts/validate.py

      - name: Run test suite
        run: python -m pytest tests -q
