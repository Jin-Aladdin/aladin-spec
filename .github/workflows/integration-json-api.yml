name: Integration, json-api

# The only workflow in this repository that reaches the real network.
#
# It is separate from Validate on purpose: the unit suite must stay green
# when an external API is slow, rate limited or down, so nothing in the
# required checks depends on api.github.com being reachable.
#
# It needs no secrets. The endpoint answers unauthenticated, which is why it
# was chosen: no personal token is part of the architecture (ADR-0005).
on:
  workflow_dispatch:
    inputs:
      apply_state:
        description: Persist automation state and audit records
        required: false
        default: false
        type: boolean
  schedule:
    # Weekly, away from minute 0 to stay out of the platform congestion window.
    - cron: "37 7 * * 3"

# Read-only. This workflow observes and reports; it never commits, merges or
# publishes. Promotion to propose level is a separate, deliberate step.
permissions:
  contents: read

concurrency:
  group: integration-json-api
  cancel-in-progress: false

jobs:
  integration:
    name: Retrieve and evaluate the real source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate the update policy before using it
        run: python scripts/validate.py --pack examples/automated-pack

      - name: Run the update engine against the real endpoint
        id: run
        run: |
          set -o pipefail
          # Without --apply nothing is persisted: this is an observation run.
          if python scripts/update_engine.py \
               --pack examples/automated-pack \
               --trigger "${{ github.event_name }}" \
               --run-id "${{ github.run_id }}" > result.txt 2>&1; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi
          cat result.txt
          outcome=$(grep -m1 '^outcome:' result.txt | awk '{print $2}' || echo unknown)
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"

      - name: Confirm the pack was not modified
        id: unchanged
        run: |
          # Whatever happened upstream, an observation run must leave the
          # working pack byte-identical. A candidate lives in .candidate,
          # which is ignored, and a rejected one lives in quarantine.
          if git diff --quiet -- examples/automated-pack; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            git diff --stat -- examples/automated-pack
          fi

      - name: Write the run summary
        run: |
          {
            echo "## Integration run against the real json-api source"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Endpoint | \`https://api.github.com/repos/curl/curl/releases/latest\` |"
            echo "| Outcome | \`${{ steps.run.outputs.outcome }}\` |"
            echo "| Engine exit | \`${{ steps.run.outputs.status }}\` |"
            echo "| Working pack unchanged | \`${{ steps.unchanged.outputs.clean }}\` |"
            echo
            echo "<details><summary>Engine output</summary>"
            echo
            echo '```'
            cat result.txt
            echo '```'
            echo
            echo "</details>"
            echo
            case "${{ steps.run.outputs.outcome }}" in
              no-change)
                echo "The source is unchanged. No candidate, no version, no commit."
                ;;
              candidate-ready)
                echo "A candidate passed every gate. Nothing was merged or published:"
                echo "promotion is a separate, deliberate step."
                ;;
              rate-limited)
                echo "The API rate limited this run. This is a scheduling signal, not a"
                echo "knowledge change. The last valid version stays active."
                ;;
              quarantined)
                echo "A candidate failed a gate and was quarantined. The last valid"
                echo "version stays active."
                ;;
              failed)
                echo "Retrieval failed. The last valid version stays active and no"
                echo "record was touched."
                ;;
              *)
                echo "Unrecognized outcome. Inspect the engine output above."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when the working pack was modified
        if: steps.unchanged.outputs.clean != 'true'
        run: |
          echo "An observation run modified the working pack. That must never happen." >&2
          exit 1

      - name: Report an unusable outcome
        if: steps.run.outputs.outcome == 'quarantined'
        run: |
          echo "A candidate was quarantined. See the summary and the quarantine entry." >&2
          exit 1
