schema_version: "0.1.0"

pack:
  id: aladdin-kb-template
  name: Aladdin Knowledge Pack Template
  version: "0.1.0"
  description: >-
    Starting point for a new Aladdin Knowledge Pack repository. Replace every
    template value before publishing anything from this repository.
  homepage: https://github.com/Jin-Aladdin/aladdin-spec
  repository: https://github.com/Jin-Aladdin/aladdin-spec
  keywords:
    - aladdin
    - template
    - knowledge-pack

specification:
  name: aladdin-knowledge-pack
  version: "0.1.0"
  compatibility:
    minimum_runtime: "0.1.0"
    supported_specification_series:
      - "0.x"

content:
  domains:
    - template
  content_types:
    - claims
    - sources
    - evidence
  entry_points:
    - claims/claims.jsonl
    - sources/sources.jsonl
    - evidence/evidence.jsonl

languages:
  primary: en
  available:
    - en

licenses:
  code: Apache-2.0
  content: CC-BY-4.0

maintainers:
  - name: Template Maintainer
    github: Jin-Aladdin
    role: owner

lifecycle:
  status: experimental
  created_at: "2026-07-27T00:00:00Z"
  updated_at: "2026-07-27T00:00:00Z"

security:
  declarative_only: true
  runtime_code: false
  prompt_injection_reviewed: false
