name: Automation health

on:
  schedule:
    - cron: "41 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-health
  cancel-in-progress: false

jobs:
  health:
    name: Heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: pack
          fetch-depth: 0

      - name: Check out the Aladdin specification tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Jin-Aladdin/aladdin-spec
          # Immutable by construction: a release tag cannot change under this
          # repository the way a branch can. Raise it deliberately when a newer
          # specification version is adopted.
          ref: v0.2.4
          path: .aladdin-spec

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .aladdin-spec/requirements-dev.txt

      - name: Write health report
        id: report
        run: |
          set +e
          python .aladdin-spec/scripts/validate.py --root pack --pack pack --schemas .aladdin-spec/schemas > /dev/null 2>&1
          validate=$([ $? -eq 0 ] && echo pass || echo fail)
          python .aladdin-spec/scripts/automation_health.py \
            --root pack --check validate=$validate --fail-when-stale
          echo "stale=$([ $? -eq 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          cat pack/automation/health.json >> "$GITHUB_STEP_SUMMARY"

      - name: Commit heartbeat
        working-directory: pack
        run: |
          # Automation metadata only. Never knowledge content.
          if git diff --quiet -- automation/health.json; then
            exit 0
          fi
          git config user.name "aladdin-automation[bot]"
          git config user.email "aladdin-automation[bot]@users.noreply.github.com"
          git add automation/health.json
          git commit -m "chore(automation): update health report [skip ci]"
          git push

      - name: Raise an issue when automation is stale
        if: steps.report.outputs.stale == 'true'
        working-directory: pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Automation health: attention required" \
            --label automation-health \
            --body-file automation/health.json
