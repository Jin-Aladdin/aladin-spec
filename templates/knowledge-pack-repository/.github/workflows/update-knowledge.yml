name: Update knowledge

# Retrieval, change detection and candidate generation. This workflow never
# publishes: promotion happens through a pull request and a release runs in a
# separate workflow with separate gates (ADR-0005).
on:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:
  repository_dispatch:
    types:
      - aladdin-update

permissions:
  contents: read

concurrency:
  # A second run must never race the first one into the same candidate.
  group: update-knowledge
  cancel-in-progress: false

jobs:
  update:
    name: Detect and propose
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: pack

      - name: Check out the Aladdin specification tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Jin-Aladdin/aladdin-spec
          # Immutable by construction: a release tag cannot change under this
          # repository the way a branch can. Raise it deliberately when a newer
          # specification version is adopted.
          ref: v0.2.4
          path: .aladdin-spec

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .aladdin-spec/requirements-dev.txt

      - name: Run the update engine
        id: engine
        run: |
          set -o pipefail
          python .aladdin-spec/scripts/update_engine.py \
            --root pack \
            --pack pack \
            --schemas .aladdin-spec/schemas \
            --trigger "${{ github.event_name }}" \
            --run-id "${{ github.run_id }}" \
            --apply | tee result.txt | tee -a "$GITHUB_STEP_SUMMARY"
          outcome=$(grep -m1 '^outcome:' result.txt | awk '{print $2}' || echo unknown)
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"

      # Only a ready candidate becomes a pull request. An unchanged source, a
      # quarantined candidate and a rate limit each end the run without one,
      # and asking for a pull request there fails on a branch that was never
      # created.
      - name: Open a pull request for a ready candidate
        if: steps.engine.outputs.outcome == 'candidate-ready'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          path: pack
          branch: automation/knowledge-update
          title: "chore(knowledge): candidate update from declared sources"
          commit-message: "chore(knowledge): candidate update from declared sources"
          body: |
            Automated candidate produced by the Aladdin update engine.

            Every gate passed. Review the record diff and the audit trail in
            `automation/audit/` before merging. Merging does not publish a
            release; that is a separate workflow.
          labels: automation, knowledge-update
          delete-branch: true
