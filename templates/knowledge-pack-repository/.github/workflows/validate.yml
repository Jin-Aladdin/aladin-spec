name: Validate

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate pack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: pack

      - name: Check out the Aladdin specification tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Jin-Aladdin/aladdin-spec
          # Immutable by construction: a release tag cannot change under this
          # repository the way a branch can. Raise it deliberately when a newer
          # specification version is adopted.
          ref: v0.2.3
          path: .aladdin-spec

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .aladdin-spec/requirements-dev.txt

      - name: Validate manifest, records and update policy
        run: python .aladdin-spec/scripts/validate.py --root pack --pack pack --schemas .aladdin-spec/schemas

      - name: Security gate
        run: python .aladdin-spec/scripts/security_scan.py --root pack --pack pack
