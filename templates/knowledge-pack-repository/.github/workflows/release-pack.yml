name: Release pack

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        type: string
  repository_dispatch:
    types:
      - aladdin-release

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.run_id }}
  cancel-in-progress: false

jobs:
  gates:
    name: Release gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: pack

      - name: Check out the Aladdin specification tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Jin-Aladdin/aladdin-spec
          # Immutable by construction: a release tag cannot change under this
          # repository the way a branch can. Raise it deliberately when a newer
          # specification version is adopted.
          ref: v0.1.0
          path: .aladdin-spec

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .aladdin-spec/requirements-dev.txt

      - name: Validate
        run: python .aladdin-spec/scripts/validate.py --root pack --pack pack

      - name: Security gate
        run: python .aladdin-spec/scripts/security_scan.py --root pack --pack pack

  publish:
    name: Build and publish
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: pack

      - name: Check out the Aladdin specification tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Jin-Aladdin/aladdin-spec
          # Immutable by construction: a release tag cannot change under this
          # repository the way a branch can. Raise it deliberately when a newer
          # specification version is adopted.
          ref: v0.1.0
          path: .aladdin-spec

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .aladdin-spec/requirements-dev.txt

      - name: Build immutable artifact
        run: |
          python .aladdin-spec/scripts/build_artifact.py \
            --pack pack \
            --out dist \
            --source-commit "${{ github.sha }}" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cd dist && sha256sum *.zip > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.zip

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ inputs.version }}
          files: |
            dist/*.zip
            dist/*.provenance.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
