schema_version: "0.1.0"

pack:
  id: aladin-kb-example
  name: Aladin Example Knowledge Pack
  version: "0.1.0"
  description: >-
    Minimal reference Knowledge Pack used to demonstrate the Aladin manifest,
    source provenance and declarative artifact structure.
  homepage: https://github.com/Jin-Aladdin/aladin-spec
  repository: https://github.com/Jin-Aladdin/aladin-spec
  keywords:
    - aladin
    - example
    - knowledge-pack
    - provenance

specification:
  name: aladin-knowledge-pack
  version: "0.1.0"
  compatibility:
    minimum_runtime: "0.1.0"
    supported_specification_series:
      - "0.x"

content:
  domains:
    - example
    - knowledge-packs
  content_types:
    - claims
    - sources
  entry_points:
    - claims/claims.jsonl
    - sources/sources.jsonl

languages:
  primary: en
  available:
    - en

licenses:
  code: Apache-2.0
  content: CC-BY-4.0

maintainers:
  - name: Jin-Aladdin
    github: Jin-Aladdin
    role: owner

lifecycle:
  status: experimental
  created_at: "2026-07-27T00:00:00Z"
  updated_at: "2026-07-27T00:00:00Z"

security:
  declarative_only: true
  runtime_code: false
  prompt_injection_reviewed: true
